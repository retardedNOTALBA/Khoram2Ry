name: Build iOS IPA

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ios:
    name: Build signed iOS IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web interface
        run: npm run build

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_APP_PROFILE: ${{ secrets.IOS_APP_PROFILE }}
          IOS_EXTENSION_PROFILE: ${{ secrets.IOS_EXTENSION_PROFILE }}
        run: xcodegen generate

      - name: Install Apple signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Install app provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Install Packet Tunnel provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/extension.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/extension.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Archive iOS app
        working-directory: ios
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_APP_PROFILE: ${{ secrets.IOS_APP_PROFILE }}
          IOS_EXTENSION_PROFILE: ${{ secrets.IOS_EXTENSION_PROFILE }}
        run: |
          xcodebuild \
            -project Khoram2Ry.xcodeproj \
            -scheme Khoram2Ry \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Khoram2Ry.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            IOS_TEAM_ID="$IOS_TEAM_ID" \
            IOS_APP_PROFILE="$IOS_APP_PROFILE" \
            IOS_EXTENSION_PROFILE="$IOS_EXTENSION_PROFILE" \
            archive

      - name: Create export options
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_APP_PROFILE: ${{ secrets.IOS_APP_PROFILE }}
          IOS_EXTENSION_PROFILE: ${{ secrets.IOS_EXTENSION_PROFILE }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store</string>
          <key>teamID</key><string>$IOS_TEAM_ID</string>
          <key>signingStyle</key><string>manual</string>
          <key>provisioningProfiles</key><dict>
          <key>com.khoram2ry.app</key><string>$IOS_APP_PROFILE</string>
          <key>com.khoram2ry.app.PacketTunnel</key><string>$IOS_EXTENSION_PROFILE</string>
          </dict>
          <key>stripSwiftSymbols</key><true/>
          <key>compileBitcode</key><false/>
          </dict></plist>
          PLIST

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Khoram2Ry.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Rename and verify IPA
        run: |
          set -euo pipefail
          mkdir -p artifacts
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          cp "$IPA" artifacts/Khoram2Ry.ipa
          unzip -t artifacts/Khoram2Ry.ipa >/dev/null
          shasum -a 256 artifacts/Khoram2Ry.ipa > artifacts/SHA256SUMS-iOS.txt

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khoram2Ry-iOS
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
