name: Build Khoram2Ry Native APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Check types and configuration tests
        run: |
          npx tsc --noEmit
          npx tsx --test tests/*.test.ts
      - name: Build the local web interface
        run: npm run build

      - name: Fetch pinned native service and core sources
        run: |
          git init build/upstream
          git -C build/upstream remote add origin https://github.com/2dust/v2rayNG.git
          git -C build/upstream fetch --depth 1 origin 5b9f24c1f0799b19f6bf43fa8d4b325df8ee137f
          git -C build/upstream checkout --detach FETCH_HEAD
          git -C build/upstream submodule update --init --recursive AndroidLibXrayLite badvpn libancillary
          test "$(git -C build/upstream/AndroidLibXrayLite rev-parse HEAD)" = "2715a3b110f64e039a4b8d2c8ca0cb5a9a6b0958"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Install the upstream-compatible NDK
        run: |
          sdkmanager --channel=3 "ndk;29.0.13113456"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13113456" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.13113456" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: build/upstream/AndroidLibXrayLite/go.mod
          cache: false

      - name: Compile the native TUN packet adapter
        working-directory: build/upstream
        run: |
          bash compile-tun2socks.sh
          mkdir -p V2rayNG/app/libs
          cp -r libs/. V2rayNG/app/libs/

      - name: Compile the pinned Xray Android library from source
        working-directory: build/upstream/AndroidLibXrayLite
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20250305212854-3a7bc9f8a4de
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20250305212854-3a7bc9f8a4de
          mkdir -p assets data
          bash gen_assets.sh download
          cp data/*.dat assets/
          gomobile init
          go mod tidy
          gomobile bind -v -target=android -androidapi 21 -trimpath -ldflags='-s -w' -o ../V2rayNG/app/libs/libv2ray.aar ./

      - name: Integrate Khoram2Ry with the real native service
        run: python3 native/prepare.py --upstream build/upstream --web dist

      - name: Compile and verify debug APKs
        working-directory: build/upstream/V2rayNG
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assemblePlaystoreDebug '-PABI_FILTERS=arm64-v8a;armeabi-v7a' --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp app/build/outputs/apk/playstore/debug/*arm64-v8a*.apk "$GITHUB_WORKSPACE/artifacts/Khoram2Ry-arm64.apk"
          cp app/build/outputs/apk/playstore/debug/*armeabi-v7a*.apk "$GITHUB_WORKSPACE/artifacts/Khoram2Ry-arm32.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$GITHUB_WORKSPACE/artifacts/Khoram2Ry-arm64.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$GITHUB_WORKSPACE/artifacts/Khoram2Ry-arm32.apk"

      - name: Include corresponding source and build provenance
        run: |
          cp build/upstream/LICENSE artifacts/LICENSE-v2rayNG.txt
          git -C build/upstream submodule status > artifacts/native-source-versions.txt
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
          tar --exclude='.git' --exclude='node_modules' --exclude='*/.gradle' --exclude='*/app/build' \
            -czf artifacts/Khoram2Ry-corresponding-source.tar.gz \
            src public native tests .github index.html package.json package-lock.json tsconfig.json vite.config.ts \
            build/upstream

      - name: Publish APKs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="auto-build-${{ github.run_number }}"
          gh release create "$TAG" \
            artifacts/Khoram2Ry-arm64.apk \
            artifacts/Khoram2Ry-arm32.apk \
            artifacts/SHA256SUMS.txt \
            --title "Khoram2Ry $TAG" \
            --notes "Single APK with the Xray VPN core inside. No second app needed. Install arm64 on modern phones, arm32 on 32-bit devices."

      - uses: actions/upload-artifact@v4
        with:
          name: Khoram2Ry-native-android
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
